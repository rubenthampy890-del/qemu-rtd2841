name: CI Build & Emulation Test

on:
  push:
    branches: [ main, 'dev/**' ]
  pull_request:
    branches: [ main, 'dev/**' ]

jobs:
  build-and-test:
    name: Build QEMU & Run Hardware Diagnostics
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential \
            git \
            ninja-build \
            meson \
            pkg-config \
            libglib2.0-dev \
            libpixman-1-dev \
            device-tree-compiler \
            libslirp-dev \
            python3 \
            binutils-arm-none-eabi

      - name: Fetch Pinned Upstream QEMU Revision
        run: |
          mkdir qemu-upstream && cd qemu-upstream
          git init
          git remote add origin https://gitlab.com/qemu-project/qemu.git
          git fetch --depth 1 origin a19f59a72d96056d9a8f48cf6c77f5787491e414
          git checkout FETCH_HEAD

      - name: Apply RTD2841 Model Patch
        run: |
          cd qemu-upstream
          git apply ../patches/qemu-rtd2841-complete.patch

      - name: Configure & Build QEMU (aarch64-softmmu)
        run: |
          cd qemu-upstream
          mkdir build && cd build
          ../configure \
            --target-list=aarch64-softmmu \
            --enable-slirp \
            --disable-werror \
            --disable-docs \
            --disable-tools
          ninja qemu-system-aarch64

      - name: Assemble Diagnostic Firmware
        run: |
          make -C tests clean
          make -C tests

      - name: Compile Device Tree Blob (DTB)
        run: |
          dtc -I dts -O dtb -o dts/rtd284x-tv030.dtb dts/rtd284x-tv030.dts
          dtc -I dts -O dtb -o dts/rtd284x.dtb dts/rtd284x.dts

      - name: Run Automated Hardware Emulation Diagnostics
        run: |
          export QEMU_BIN="$(pwd)/qemu-upstream/build/qemu-system-aarch64"
          python3 tests/run_ci_test.py

      - name: Archive CI Test Logs & Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-rtd2841-ci-logs
          path: |
            tests/verification_log.txt
            *.log

  shader-validation:
    name: GLSL validation and Android readiness predicates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Install Host Compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang build-essential python3 git
      - name: Fetch Pinned GLSL Compiler Source
        run: |
          mkdir -p build/phase3/swiftshader-src
          git -C build/phase3/swiftshader-src init
          git -C build/phase3/swiftshader-src remote add origin https://github.com/google/swiftshader.git
          git -C build/phase3/swiftshader-src fetch --depth 1 origin ce69367855c4961f8ab06323512e1958fe21b80a
          git -C build/phase3/swiftshader-src checkout --detach FETCH_HEAD
      - name: Run Firmware Independent Tests
        run: |
          python3 tests/test_shader_validation.py
          PYTHONPATH=tests python3 -m unittest tests/test_android_readiness.py
